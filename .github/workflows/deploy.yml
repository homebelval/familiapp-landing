name: Deploy to Infomaniak

# NOTE: Le déploiement automatique depuis GitHub Actions est bloqué par
# Infomaniak (plan Starter — IPs cloud non autorisées au niveau réseau).
# Déploiement manuel via WebFTP : manager.infomaniak.com → Hébergement → WebFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Minify CSS & JS
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            docs/**
            .claude/**
            og-image-TODO.txt
            package.json
            package-lock.json
            postcss.config.js
            scripts/**
